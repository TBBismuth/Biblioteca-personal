[package]
name = "biblioteca-personal"
version = "0.1.0"
description = "Aplicación de escritorio para gestionar una biblioteca personal"
authors = ["Miguel"]
edition = "2021"

[lib]
name = "biblioteca_personal_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
