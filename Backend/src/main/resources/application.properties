spring.application.name=Biblioteca_personal

spring.datasource.url=${BIBLIOTECA_DB_URL:jdbc:h2:file:./data/biblioteca_personal}
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=miguel
spring.datasource.password=

server.address=${BIBLIOTECA_SERVER_ADDRESS:127.0.0.1}
server.port=${BIBLIOTECA_SERVER_PORT:8080}
biblioteca.managed-process=${BIBLIOTECA_MANAGED_PROCESS:false}

spring.jpa.hibernate.ddl-auto=update

spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Consola web de H2
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
