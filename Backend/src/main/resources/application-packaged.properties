# Ejecución local empaquetada: conserva ddl-auto=update y la conexión recibida
# desde la configuración base, pero desactiva las ayudas exclusivas de desarrollo.
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.h2.console.enabled=false

# Reduce información de arranque innecesaria en el proceso auxiliar.
spring.main.banner-mode=off
